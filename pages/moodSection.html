    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>GreenMood</title>
</head>
<body>
    <nav class="navbar">
        <div class="wrapper">
            <div class="left">
                <a href="">
                    <i class="fa-solid fa-bars" style="color: #3A5A40;"></i>
                    <a class="homepage" href="/index.html">Home</a>
                </a>
            </div>
            <div class="right">
                <a href="/pages/forYourMind.html">For Your Mind</a>
                <a href="">About</a>
                <a href="">Portfolio</a>
                <a href="">Contact</a>
            </div>
        </div>
    </nav>
    <div class="feelings">
            <p class="gettingInfo">How are you feeling Today?</p>
        </div>
        <div class="feels">
            <div class="soHappy">
                <button>
                    <i class="fa-regular fa-face-grin-beam" style="color: #3A5A40;"></i>
                    <p class="great">Great</p>
                </button>
            </div>
            <div class="happy">
                <button>
                <i class="fa-regular fa-face-smile" style="color: #3A5A40;"></i>
                <p class="happyP">Fine</p>
                </button>
            </div>
            <div class="neutral">
                <button>
                    <i class="fa-regular fa-face-meh" style="color: #3A5A40;"></i>
                    <p class="neutralP">Neutral</p>
                </button>
            </div>
            <div class="sad">
                <button>
                    <i class="fa-regular fa-face-frown-open" style="color: #3A5A40;"></i>
                    <p class="sadP">Upset</p>
                </button>
            </div>
            <div class="angry">
                <button>
                    <i class="fa-regular fa-face-angry" style="color: #3A5A40;"></i>
                    <p class="angryP">Mad</p>
                </button>
            </div>
        </div>
</body>
